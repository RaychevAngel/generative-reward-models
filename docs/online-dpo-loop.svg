<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 910" role="img" aria-labelledby="title desc">
  <title id="title">The distributed online preference-learning loop</title>
  <desc id="desc">Training prompts enter the current policy, which samples two fresh responses. A generative judge compares the A/B and B/A orderings, filters zero-sum verdicts and constructs a chosen/rejected pair. The current policy and a separate frozen reference score that pair. Their response-token log probabilities form a masked DPO loss. A Ray-orchestrated FSDP update changes the current policy and refreshes its sampler. Separately, a learned 32B Gold evaluator measures saved policy outputs; Gold does not supply these training preferences.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <marker id="loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2563a4"/></marker>
  </defs>
  <rect width="660" height="910" fill="#fff"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#202d3a">
    <text x="30" y="37" font-size="25" font-weight="700">The online preference-learning loop</text>
    <text x="30" y="67" font-size="19" fill="#526172">Fresh rollouts → preference pairs → distributed updates</text>
    <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M300 173H360"/>
      <path d="M495 246V266H330V283"/>
      <path d="M330 351V373H177V397"/>
      <path d="M330 373H483V397"/>
      <path d="M177 525V570"/>
      <path d="M483 525V546H177"/>
      <path d="M300 634H360"/>
    </g>
    <path d="M495 708V738H13V173H30" fill="none" stroke="#2563a4" stroke-width="2.2" marker-end="url(#loop-arrow)"/>
    <g stroke="#c4ced8" stroke-width="1.4" fill="#f8fafc">
      <rect x="30" y="102" width="270" height="144" rx="4"/>
      <rect x="360" y="102" width="270" height="144" rx="4"/>
      <rect x="90" y="283" width="480" height="68" rx="4" fill="#eff5fa"/>
      <rect x="50" y="397" width="255" height="128" rx="4"/>
      <rect x="355" y="397" width="255" height="128" rx="4"/>
      <rect x="30" y="570" width="270" height="138" rx="4"/>
      <rect x="360" y="570" width="270" height="138" rx="4"/>
    </g>
    <g text-anchor="middle">
      <text x="165" y="136" font-size="23" font-weight="700">Current policy</text>
      <text x="165" y="168" font-size="20">Samples two responses</text>
      <text x="165" y="197" font-size="19" fill="#526172">Fresh vLLM rollouts</text>
      <text x="165" y="226" font-size="18" fill="#526172">Input: training prompts</text>

      <text x="495" y="136" font-size="23" font-weight="700">Generative judge</text>
      <text x="495" y="168" font-size="20">Compare A/B and B/A</text>
      <text x="495" y="197" font-size="19" fill="#526172">Filter zero-sum verdicts</text>
      <text x="495" y="226" font-size="18" fill="#526172">Assign chosen / rejected</text>

      <text x="330" y="311" font-size="22" font-weight="700">Chosen / rejected response pair</text>
      <text x="330" y="336" font-size="18" fill="#526172">Retain response tokens for both likelihood calculations</text>

      <text x="177" y="432" font-size="22" font-weight="700">Current policy</text>
      <text x="177" y="460" font-size="22" font-weight="700">likelihoods</text>
      <text x="177" y="495" font-size="19" fill="#526172">Trainable policy weights</text>

      <text x="483" y="432" font-size="22" font-weight="700">Frozen reference</text>
      <text x="483" y="465" font-size="19" fill="#526172">Frozen policy weights</text>
      <text x="483" y="495" font-size="19" fill="#526172">Not the reward model</text>

      <text x="165" y="606" font-size="23" font-weight="700">Online DPO loss</text>
      <text x="165" y="638" font-size="19" fill="#526172">Response-token mask</text>
      <text x="165" y="666" font-size="19" fill="#526172">Current–reference margins</text>
      <text x="165" y="693" font-size="18" fill="#526172">Chosen versus rejected</text>

      <text x="495" y="606" font-size="23" font-weight="700">Distributed update</text>
      <text x="495" y="638" font-size="19" fill="#526172">Ray orchestration · FSDP</text>
      <text x="495" y="666" font-size="19" fill="#526172">Periodic checkpoints</text>
      <text x="495" y="693" font-size="18" fill="#526172">Refresh current-policy sampler</text>

      <text x="330" y="768" font-size="19" fill="#2563a4">Updated weights become the next current policy</text>
    </g>
    <path d="M30 793H630" fill="none" stroke="#dfe5eb" stroke-width="1.4"/>
    <text x="30" y="831" font-size="23" font-weight="700">Separate Gold measurement</text>
    <text x="30" y="863" font-size="20">Saved policy outputs → learned 32B Gold evaluator</text>
    <text x="30" y="893" font-size="18" fill="#526172">Measures policy trajectories; does not supply these training preferences.</text>
  </g>
</svg>
